name: Build LOTATO PRO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Download icons from lotato1.onrender.com
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          curl -L "https://lotato1.onrender.com/48.png"  -o app/src/main/res/mipmap-mdpi/ic_launcher.png
          curl -L "https://lotato1.onrender.com/48.png"  -o app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          curl -L "https://lotato1.onrender.com/72.png"  -o app/src/main/res/mipmap-hdpi/ic_launcher.png
          curl -L "https://lotato1.onrender.com/72.png"  -o app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          curl -L "https://lotato1.onrender.com/96.png"  -o app/src/main/res/mipmap-xhdpi/ic_launcher.png
          curl -L "https://lotato1.onrender.com/96.png"  -o app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          curl -L "https://lotato1.onrender.com/144.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          curl -L "https://lotato1.onrender.com/144.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          curl -L "https://lotato1.onrender.com/192.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          curl -L "https://lotato1.onrender.com/192.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOTATO-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
