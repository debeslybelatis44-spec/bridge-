name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install expo & eas CLI globally
        run: |
          npm install -g expo-cli eas-cli
      - name: Install dependencies
        run: npm install
      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --output=./app-build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotato-print.apk
          path: ./app-build.apk
